kind = "web"
previewPath = "/"
title = "Mylla IA Landing Page"
version = "1.0.0"
id = "artifacts/finfamily-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22763

[services.development]
run = "pnpm --filter @workspace/finfamily-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/finfamily-landing", "run", "build" ]
publicDir = "artifacts/finfamily-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22763"
BASE_PATH = "/"
